name: Run Auto Generate JSON with C# File

on:
  push:
    branches:
      - main
      - master
      - Skua
      - dev
      - 'feature/*'

jobs:
  run-csharp-file:
    runs-on: ubuntu-latest

    steps:
    # =========================================
    # Checkout
    # =========================================
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    - name: Configure git
      run: git config --global core.autocrlf false

    # =========================================
    # Cache
    # =========================================
    - name: Cache NuGet packages
      uses: actions/cache@v4.2.0
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.cs') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    # =========================================
    # .NET setup
    # =========================================
    - name: Setup .NET
      uses: actions/setup-dotnet@v4.2.0
      with:
        dotnet-version: '8.0.x'

    # =========================================
    # Build
    # =========================================
    - name: Build project
      run: dotnet build --configuration Release SkuaScriptsGenerator/SkuaScriptsGenerator.csproj

    # =========================================
    # Run generator
    # =========================================
    - name: Run C# file
      run: dotnet run --project SkuaScriptsGenerator/SkuaScriptsGenerator.csproj 2>/dev/null > scripts.json

    # =========================================
    # Upload artifact
    # =========================================
    - name: Upload artifact
      uses: actions/upload-artifact@v4.6.0
      with:
        name: scripts-${{ github.run_id }}.json
        path: scripts.json
        retention-days: 60

    # =========================================
    # Commit changes
    # =========================================
    - name: Git Auto Commit
      uses: stefanzweifel/git-auto-commit-action@v5.1.0
      with:
        commit_message: "Automatic commit by GitHub Actions"
        file_pattern: scripts.json
        push_options: "--force"
        branch: "${{ github.ref_name }}"

    # =========================================
    # FETCH LATEST GITHUB ACTIONS STATUS
    # =========================================
    - name: Get Latest Workflow Status
      id: gh_status
      run: |
        API_URL="https://api.github.com/repos/${{ github.repository }}/actions/runs?branch=${{ github.ref_name }}&per_page=1"

        RESPONSE=$(curl -s -H "Accept: application/vnd.github+json" "$API_URL")

        STATUS=$(echo "$RESPONSE" | jq -r '.workflow_runs[0].status')
        CONCLUSION=$(echo "$RESPONSE" | jq -r '.workflow_runs[0].conclusion')

        echo "status=$STATUS" >> $GITHUB_OUTPUT
        echo "conclusion=$CONCLUSION" >> $GITHUB_OUTPUT

    # =========================================
    # LOAD DASHBOARD MESSAGE ID
    # =========================================
    - name: Load dashboard message id
      id: load_msg
      run: |
        if [ ! -f .github/ci-dashboard.json ]; then
          echo '{"message_id":""}' > .github/ci-dashboard.json
        fi

        MESSAGE_ID=$(jq -r '.message_id' .github/ci-dashboard.json)
        echo "message_id=$MESSAGE_ID" >> $GITHUB_OUTPUT

    # =========================================
    # CREATE DASHBOARD MESSAGE (FIRST RUN ONLY)
    # =========================================
    - name: Create Discord Dashboard Message
      if: steps.load_msg.outputs.message_id == ''
      id: create_msg
      run: |
        RESPONSE=$(curl -s -H "Content-Type: application/json" \
        -X POST \
        -d '{
          "username": "Skua CI",
          "embeds": [
            {
              "title": "⚙️ CI Dashboard (LIVE)",
              "description": "Initializing live CI dashboard...",
              "color": 7506394
            }
          ]
        }' \
        ${{ secrets.DISCORD_WEBHOOK_URL }}?wait=true)

        MESSAGE_ID=$(echo "$RESPONSE" | jq -r '.id')

        echo "{\"message_id\":\"$MESSAGE_ID\"}" > .github/ci-dashboard.json

    # =========================================
    # UPDATE DASHBOARD MESSAGE (LIVE MODE)
    # =========================================
    - name: Update Discord Dashboard
      run: |
        RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        REPO="${{ github.repository }}"
        BRANCH="${{ github.ref_name }}"

        STATUS="${{ steps.gh_status.outputs.status }}"
        CONCLUSION="${{ steps.gh_status.outputs.conclusion }}"

        if [ "$STATUS" = "in_progress" ]; then
          STATE="🟡 RUNNING"
        elif [ "$CONCLUSION" = "success" ]; then
          STATE="🟢 SUCCESS"
        elif [ "$CONCLUSION" = "failure" ]; then
          STATE="🔴 FAILED"
        else
          STATE="⚪ UNKNOWN"
        fi

        MESSAGE_ID="${{ steps.load_msg.outputs.message_id }}"

        curl -H "Content-Type: application/json" \
        -X PATCH \
        -d "{
          \"embeds\": [
            {
              \"title\": \"⚙️ CI Dashboard (LIVE)\",
              \"description\": \"$STATE\",
              \"color\": 7506394,
              \"fields\": [
                {
                  \"name\": \"📦 Repository\",
                  \"value\": \"$REPO\",
                  \"inline\": true
                },
                {
                  \"name\": \"🌿 Branch\",
                  \"value\": \"$BRANCH\",
                  \"inline\": true
                },
                {
                  \"name\": \"📊 Actions Run\",
                  \"value\": \"$RUN_URL\",
                  \"inline\": false
                },
                {
                  \"name\": \"📡 Update Channel\",
                  \"value\": \"<#1090773691006193714>\",
                  \"inline\": false
                }
              ],
              \"footer\": {
                \"text\": \"Live CI Dashboard • Single Message Mode\"
              }
            }
          ]
        }" \
        ${{ secrets.DISCORD_WEBHOOK_URL }}/messages/$MESSAGE_ID
